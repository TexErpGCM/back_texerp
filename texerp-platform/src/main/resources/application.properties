spring.application.name=texerp-platform

# Permite ejecutar localmente con infra/ovh-postgres/.env (ignorado por Git).
# En otros entornos las mismas claves se inyectan como variables de entorno.
spring.config.import=optional:file:./infra/ovh-postgres/.env[.properties]

# Los tres valores se inyectan como variables de entorno. La URL debe usar
# sslmode=verify-full y el certificado CA del VPS (root.crt) debe estar
# instalado en la ruta que reconoce el driver PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${TEXERP_DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${TEXERP_DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${TEXERP_DB_CONNECTION_TIMEOUT_MS:30000}

# El DDL es gestionado exclusivamente por Flyway en db/migration.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${TEXERP_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# =========================
# JWT ACCESS TOKEN
# =========================
app.jwt.secret=${TEXERP_JWT_SECRET}
app.jwt.access-expiration-minutes=${TEXERP_JWT_ACCESS_EXPIRATION:15}

# =========================
# REFRESH TOKEN
# =========================
app.refresh-token.expiration-days=${TEXERP_REFRESH_TOKEN_EXPIRATION_DAYS:7}

app.seed.enabled=${TEXERP_SEED_ENABLED:false}

app.seed.admin-name=${TEXERP_ADMIN_NAME}
app.seed.admin-email=${TEXERP_ADMIN_EMAIL}
app.seed.admin-password=${TEXERP_ADMIN_PASSWORD}

app.seed.analyst-name=${TEXERP_ANALYST_NAME}
app.seed.analyst-email=${TEXERP_ANALYST_EMAIL}
app.seed.analyst-password=${TEXERP_ANALYST_PASSWORD}

# =========================================
# DATA WAREHOUSE - ETL
# =========================================

texerp.etl.enabled=${TEXERP_ETL_ENABLED:true}
texerp.etl.schema=texerp_dw

# Ejecución automática
texerp.etl.scheduler.enabled=${TEXERP_ETL_SCHEDULER_ENABLED:false}

# Flyway operacional
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public


# =========================================
# DATA WAREHOUSE - INVENTORY SNAPSHOT
# =========================================

# Habilitar o deshabilitar la captura automática
texerp.inventory.snapshot.enabled=${TEXERP_INVENTORY_SNAPSHOT_ENABLED:false}

# Captura diaria a las 11:59:50 p. m. (hora Colombia)
texerp.inventory.snapshot.cron=50 59 23 * * *


# =========================================
# DATA WAREHOUSE - PURCHASE ANALYTICS HU-29
# =========================================

# Habilitar sincronización automática de compras
texerp.analytics.purchases.sync.enabled=${TEXERP_PURCHASES_SYNC_ENABLED:true}

# Sincronizar cada 5 minutos
texerp.analytics.purchases.sync.cron=0 */5 * * * *